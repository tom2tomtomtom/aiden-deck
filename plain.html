<title>AIDEN // Plain English</title>
<style>
  *{box-sizing:border-box;border-radius:0!important}
  html,body{margin:0;height:100%}
  body{
    background:#050505;color:#fff;overflow:hidden;
    font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background-image:linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);
    background-size:24px 24px;
  }
  /* The deck commits to one visual world, so the gate does too rather than
     inverting into a light theme the brand does not have. */
  :root[data-theme="light"] body,:root[data-theme="dark"] body{background-color:#050505;color:#fff}
  #gate{height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
  form{width:100%;max-width:420px}
  h1{
    font-size:clamp(30px,5vw,52px);line-height:1;font-weight:800;letter-spacing:-.02em;
    text-transform:uppercase;color:#ff2e2e;margin:0 0 6px;
  }
  .sub{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.5px;letter-spacing:.2em;
    text-transform:uppercase;color:rgba(255,255,255,.42);margin:0 0 28px;
  }
  label{
    display:block;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.5px;
    letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.6);margin-bottom:8px;
  }
  input{
    width:100%;background:#0f0f0f;border:2px solid rgba(255,255,255,.12);color:#fff;
    padding:13px 14px;font-size:16px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  input:focus{outline:none;border-color:#ff2e2e;background:#0a0a0a}
  button{
    width:100%;margin-top:14px;background:#ff2e2e;color:#fff;border:2px solid #ff2e2e;
    padding:13px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;cursor:pointer;
  }
  button:hover:not(:disabled){background:#cc2525;border-color:#cc2525}
  button:disabled{opacity:.55;cursor:progress}
  button:focus-visible,input:focus-visible{outline:2px solid #ff2e2e;outline-offset:2px}
  #msg{
    margin-top:14px;min-height:1.3em;font-size:13px;color:#ff2e2e;
  }
  .note{margin-top:26px;font-size:12px;line-height:1.6;color:rgba(255,255,255,.42)}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:none;background:#050505}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="gate">
  <form id="f" autocomplete="off">
    <h1>AIDEN</h1>
    <p class="sub">Confidential &middot; passphrase required</p>
    <label for="p">Passphrase</label>
    <input id="p" type="password" inputmode="text" autocapitalize="none" spellcheck="false"
           placeholder="six words, separated by hyphens" required autofocus>
    <button id="b" type="submit">Open the deck</button>
    <p id="msg" role="status" aria-live="polite"></p>
    <p class="note">This page holds the deck encrypted. Nothing readable is here until the
      passphrase decrypts it in your browser, so there is no version of this to find in the
      source.</p>
  </form>
</div>

  var bytes = function (b64s) { return Uint8Array.from(atob(b64s), function (c) { return c.charCodeAt(0); }); };

  var form = document.getElementById('f'), input = document.getElementById('p');
  var button = document.getElementById('b'), msg = document.getElementById('msg');

  form.addEventListener('submit', async function (event) {
    event.preventDefault();
    button.disabled = true;
    // 700k iterations takes a moment on a phone, so say so rather than look broken.
    msg.style.color = 'rgba(255,255,255,.42)';
    msg.textContent = 'Deriving key...';
    try {
      var base = await crypto.subtle.importKey(

      var html = new TextDecoder().decode(plain);
      var frame = document.getElementById('deck');
      frame.srcdoc = html;
      frame.style.display = 'block';
      document.getElementById('gate').remove();
      frame.focus();
    } catch (err) {
      // AES-GCM fails authentication on a wrong key, so this is the only signal needed.
      msg.style.color = '#ff2e2e';
      msg.textContent = 'That passphrase does not open it. Check for a missing or extra word.';
      button.disabled = false;
      input.select();
